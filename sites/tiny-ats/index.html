<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Inbox Hire. ATS for tiny teams who hire twice a year.</title>
<meta name="description" content="Greenhouse is $400 a month per open role. You're a 5-person startup hiring one engineer. Inbox Hire is $20/month for the kanban, the scheduling, and the rejection emails.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>html,body{margin:0;padding:0;background:#0F1218}.__loading{font-family:Inter,system-ui;color:#888;text-align:center;padding-top:200px}</style></head><body>
<div id="root"><div class="__loading">Loading...</div></div>
<script type="text/babel" data-presets="react">
const { useState } = React;
const STAGES = [
  { name:"Applied", count:42, top:[{n:"Alex K.",when:"2h ago"},{n:"Priya M.",when:"5h ago"},{n:"Sam T.",when:"1d ago"}] },
  { name:"Screen", count:8, top:[{n:"Maria L.",when:"30m today"},{n:"Dev R.",when:"tomorrow 10am"}] },
  { name:"Onsite", count:3, top:[{n:"Jin C.",when:"Thu 1pm"},{n:"Aria W.",when:"Fri 10am"}] },
  { name:"Offer", count:1, top:[{n:"Cooper B.",when:"verbal yes — letter out"}] },
  { name:"Closed", count:11, top:[] }
];
function App(){
  const [view,setView]=useState("landing");
  function open(){ setView("dash"); setTimeout(()=>document.getElementById("d")?.scrollIntoView({behavior:"smooth"}),80); }
  const P={bg:"#0F1218",ink:"#E8EAED",inkSoft:"#B0B8C4",card:"#171B22",paper:"#1B2030",rule:"#2A3441",accent:"#A78BFA",mute:"#7A8595"};
  const wrap={maxWidth:820,margin:"0 auto",padding:"64px 24px 96px"};
  const display="'Fraunces',Georgia,serif",sans="Inter,system-ui,sans-serif",mono="'JetBrains Mono',ui-monospace,monospace";
  return <div style={{background:P.bg,color:P.ink,fontFamily:sans,minHeight:"100vh"}}>
    <header style={wrap}>
      <div data-testid="eyebrow" style={{fontFamily:mono,fontSize:11,color:P.accent,letterSpacing:"0.2em",textTransform:"uppercase",marginBottom:32}}>For startups hiring 1-3 roles a year</div>
      <h1 style={{fontFamily:display,fontWeight:400,fontSize:"clamp(46px,7vw,82px)",lineHeight:0.97,letterSpacing:"-0.035em",margin:0}}>Greenhouse is $400.<br/>You hire <em style={{fontStyle:"italic",color:P.accent}}>twice a year.</em></h1>
      <p style={{fontFamily:display,fontSize:22,fontStyle:"italic",lineHeight:1.45,color:P.inkSoft,margin:"32px 0 28px",maxWidth:600}}>You don't need an ATS. You need a kanban, a calendar integration, and a polite rejection email that actually goes out. Drop resumes in, drag them between stages, schedule with one click, never ghost a candidate again.</p>
      <div style={{display:"flex",flexWrap:"wrap",gap:16,alignItems:"center"}}>
        <button data-testid="try-sample" onClick={open} style={{fontFamily:sans,fontSize:16,fontWeight:600,background:P.accent,color:"#0F0820",border:"none",padding:"16px 28px",borderRadius:4,cursor:"pointer"}}>Show me a sample role →</button>
        <span style={{fontFamily:mono,fontSize:11,color:P.mute,textTransform:"uppercase"}}>· $20/month · unlimited roles</span>
      </div>
    </header>
    {view==="dash"&&<section id="d" style={{...wrap,paddingTop:0}}>
      <div data-testid="summary" style={{background:P.card,border:`1px solid ${P.rule}`,borderRadius:6,padding:24,marginBottom:14}}>
        <div style={{fontFamily:mono,fontSize:11,color:P.accent,letterSpacing:0.15,textTransform:"uppercase",marginBottom:8}}>Open · Senior Backend Engineer · 42 applied · avg time-to-close 4 days</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10}}>
        {STAGES.map((s,i)=>(<div key={i} style={{background:P.card,border:`1px solid ${P.rule}`,borderRadius:4,padding:"14px 16px",minHeight:200}}>
          <div style={{fontFamily:mono,fontSize:11,color:P.accent,letterSpacing:0.1,textTransform:"uppercase",marginBottom:10}}>{s.name} <span style={{color:P.mute}}>· {s.count}</span></div>
          {s.top.map((c,j)=>(<div key={j} style={{padding:"8px 10px",background:P.paper,borderRadius:3,marginBottom:6}}>
            <div style={{fontFamily:sans,fontSize:12,fontWeight:600}}>{c.n}</div>
            <div style={{fontFamily:mono,fontSize:10,color:P.mute,marginTop:2}}>{c.when}</div>
          </div>))}
        </div>))}
      </div>
      <div style={{marginTop:24,padding:"14px 22px",background:P.paper,border:`1px solid ${P.rule}`,borderLeft:`3px solid ${P.accent}`,borderRadius:4,fontFamily:sans,fontSize:13,color:P.ink}}><strong style={{fontFamily:mono,fontSize:10,color:P.accent,letterSpacing:0.15,textTransform:"uppercase",marginRight:8}}>Auto-pilot</strong>5 applicants in screen for 9+ days. Auto-rejection drafts ready to send. Click to review.</div>
    </section>}
    <footer style={{...wrap,paddingTop:32,paddingBottom:56,borderTop:`1px solid ${P.rule}`}}><div style={{fontFamily:mono,fontSize:11,color:P.mute,textAlign:"center",lineHeight:1.65}}>Google Calendar integration. Forwards resumes from a careers@ alias. Closes the loop on every candidate.</div></footer>
  </div>;
}
const root = ReactDOM.createRoot(document.getElementById("root")); root.render(<App/>);
</script>
<script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="gooboolygoo" data-description="Support me on Buy me a coffee!" data-message="Love this project? Donate to keep it going" data-color="#5F7FFF" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
</body></html>
