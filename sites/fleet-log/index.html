<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Truck Log. Service tracking for fleets under 30.</title>
<meta name="description" content="Fleetio is built for 100 trucks. You have 8. Your service log is a clipboard. Truck Log is the maintenance reminders, document storage, and cost tracking for the people Fleetio overlooked.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>html,body{margin:0;padding:0;background:#0F1218}.__loading{font-family:Inter,system-ui;color:#888;text-align:center;padding-top:200px}</style></head><body>
<div id="root"><div class="__loading">Loading...</div></div>
<script type="text/babel" data-presets="react">
const { useState } = React;
const VEHICLES = [
  { id:"T-01", name:"Ford F-250 (Sam)", miles:48210, last_oil:"Apr 03 @ 46,800", next_oil_at:51800, status:"watch", due:"in ~1.5 weeks" },
  { id:"T-02", name:"Chevy 2500 (Marco)", miles:81444, last_oil:"Mar 15 @ 79,200", next_oil_at:84200, status:"ok", due:"in ~6 weeks" },
  { id:"T-03", name:"Ford Transit (delivery)", miles:62018, last_oil:"Feb 02 @ 56,800", next_oil_at:61800, status:"overdue", due:"218 miles overdue" },
  { id:"T-04", name:"Isuzu NPR (cube)", miles:104112, last_oil:"Apr 22 @ 102,800", next_oil_at:107800, status:"ok", due:"in ~9 weeks" },
  { id:"T-05", name:"Ford F-150 (estimator)", miles:31840, last_oil:"Mar 28 @ 30,400", next_oil_at:35400, status:"ok", due:"in ~12 weeks" }
];
const RECENT = [
  { d:"May 14", v:"T-03", what:"Coolant top-off", cost:18, who:"Marco" },
  { d:"May 09", v:"T-02", what:"Front brakes + rotors", cost:482, who:"Discount Auto" },
  { d:"May 02", v:"T-01", what:"New windshield wipers", cost:32, who:"Sam" }
];
function App(){
  const [view,setView]=useState("landing");
  function open(){ setView("dash"); setTimeout(()=>document.getElementById("dash")?.scrollIntoView({behavior:"smooth"}),80); }
  const P={bg:"#0F1218",ink:"#E8EAED",inkSoft:"#B0B8C4",card:"#171B22",paper:"#1B2030",rule:"#2A3441",accent:"#FB923C",overdue:"#EF4444",watch:"#FBBF24",ok:"#10B981",mute:"#7A8595"};
  const wrap={maxWidth:820,margin:"0 auto",padding:"64px 24px 96px"};
  const display="'Fraunces',Georgia,serif",sans="Inter,system-ui,sans-serif",mono="'JetBrains Mono',ui-monospace,monospace";
  function sc(s){return P[s]||P.mute;}
  return <div style={{background:P.bg,color:P.ink,fontFamily:sans,minHeight:"100vh"}}>
    <header style={wrap}>
      <div data-testid="eyebrow" style={{fontFamily:mono,fontSize:11,color:P.accent,letterSpacing:"0.2em",textTransform:"uppercase",marginBottom:32}}>For fleets between 3 and 30 vehicles</div>
      <h1 style={{fontFamily:display,fontWeight:400,fontSize:"clamp(46px,7vw,82px)",lineHeight:0.97,letterSpacing:"-0.035em",margin:0}}>Fleetio is built for<br/>200 trucks.<br/><em style={{fontStyle:"italic",color:P.accent}}>You have eight.</em></h1>
      <p style={{fontFamily:display,fontSize:22,fontStyle:"italic",lineHeight:1.45,color:P.inkSoft,margin:"32px 0 28px",maxWidth:600}}>Your service log is a clipboard in the glove box. The transit van is 200 miles overdue for an oil change and nobody noticed. Truck Log is the maintenance reminders, document storage, and cost tracking for the small fleets Fleetio overlooked.</p>
      <div style={{display:"flex",flexWrap:"wrap",gap:16,alignItems:"center"}}>
        <button data-testid="try-sample" onClick={open} style={{fontFamily:sans,fontSize:16,fontWeight:600,background:P.accent,color:"#1F1408",border:"none",padding:"16px 28px",borderRadius:4,cursor:"pointer"}}>Show me a sample 5-truck fleet →</button>
        <span style={{fontFamily:mono,fontSize:11,color:P.mute,textTransform:"uppercase"}}>· $6/vehicle/month</span>
      </div>
    </header>
    {view==="dash"&&<section id="dash" style={{...wrap,paddingTop:0}}>
      <div data-testid="summary" style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14,marginBottom:14}}>
        {[{l:"Vehicles",v:5,c:P.accent},{l:"Overdue",v:1,c:P.overdue},{l:"Watch",v:1,c:P.watch}].map((r,i)=>(<div key={i} style={{background:P.card,border:`1px solid ${P.rule}`,borderRadius:6,padding:"18px 22px"}}><div style={{fontFamily:mono,fontSize:10,color:P.mute,letterSpacing:0.15,textTransform:"uppercase",marginBottom:6}}>{r.l}</div><div style={{fontFamily:display,fontSize:32,fontWeight:500,color:r.c}}>{r.v}</div></div>))}
      </div>
      {VEHICLES.map((v,i)=>(<div key={i} style={{background:P.card,border:`1px solid ${P.rule}`,borderLeft:`4px solid ${sc(v.status)}`,borderRadius:4,padding:"16px 22px",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",flexWrap:"wrap",gap:8}}>
          <div><div style={{fontFamily:sans,fontSize:15,fontWeight:600}}>{v.id} · {v.name}</div><div style={{fontFamily:mono,fontSize:11,color:P.mute,marginTop:2}}>{v.miles.toLocaleString()} mi · last oil {v.last_oil}</div></div>
          <div style={{fontFamily:mono,fontSize:11,color:sc(v.status),textTransform:"uppercase",letterSpacing:0.1}}>{v.status} · {v.due}</div>
        </div>
      </div>))}
      <div style={{marginTop:24,padding:24,background:P.paper,border:`1px solid ${P.rule}`,borderRadius:6}}>
        <div style={{fontFamily:mono,fontSize:11,color:P.accent,letterSpacing:0.15,textTransform:"uppercase",marginBottom:14}}>Recent service log</div>
        {RECENT.map((r,i)=>(<div key={i} style={{padding:"10px 0",borderTop:i>0?`1px solid ${P.rule}`:"none",display:"grid",gridTemplateColumns:"80px 80px 1fr 80px",gap:12,alignItems:"baseline",fontFamily:sans,fontSize:13}}><div style={{fontFamily:mono,color:P.mute}}>{r.d}</div><div style={{fontFamily:mono,color:P.ink}}>{r.v}</div><div>{r.what} · <span style={{color:P.mute}}>{r.who}</span></div><div style={{fontFamily:mono,textAlign:"right"}}>${r.cost}</div></div>))}
      </div>
    </section>}
    <footer style={{...wrap,paddingTop:32,paddingBottom:56,borderTop:`1px solid ${P.rule}`}}><div style={{fontFamily:mono,fontSize:11,color:P.mute,textAlign:"center",lineHeight:1.65}}>Production version texts the driver when their truck is due, and emails you when it goes overdue.</div></footer>
  </div>;
}
const root = ReactDOM.createRoot(document.getElementById("root")); root.render(<App/>);
</script>
<script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="gooboolygoo" data-description="Support me on Buy me a coffee!" data-message="Love this project? Donate to keep it going" data-color="#5F7FFF" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
</body></html>
