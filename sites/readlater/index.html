<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Stack. The reading list after Pocket.</title>
<meta name="description" content="Pocket is shutting down. Your reading list is homeless. Paste an article, get a TL;DR you can actually skim, the key passages, and a categorized save."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>html,body{margin:0;padding:0;background:#F8F6F0}.__loading{font-family:Inter,system-ui,sans-serif;color:#888;text-align:center;padding-top:200px}</style></head><body>
<div id="root"><div class="__loading">Loading...</div></div>
<script type="text/babel" data-presets="react">
const { useState } = React;
const SAMPLE = "https://www.nature.com/articles/s41586-024-08328-6";
const MOCK = {
  title: "Genome-scale Bayesian network for individual cancer risk prediction",
  source: "Nature, 2025",
  read_time: "9 min",
  tldr: "Researchers trained a Bayesian graph over 4,200 cancer-related genes to predict individual cancer onset risk from genome + lifestyle data. Achieved AUC 0.81 on held-out UK Biobank cohort, vs 0.69 for the polygenic risk score baseline.",
  key_passages: ["\"The model's gains over PRS came almost entirely from interaction terms between germline variants and modifiable lifestyle factors, not from new variant discovery.\"","\"Performance dropped sharply on non-European ancestry subsets (AUC 0.73), highlighting the persistent bias in genomic training data.\"","\"Prospective validation in 18,000 participants is planned for 2027.\""],
  why_save: "Concrete number on PRS limitations, plus the ancestry-bias caveat is the rebuttal to overhyped 'precision medicine' claims you'll see in the next month of news.",
  tags: ["genomics","bayesian","health"],
  later: "Read alongside the GWAS critique from 2023 you saved (tagged 'genomics')."
};
const delay = (ms) => new Promise(r => setTimeout(r, ms));
function App(){
  const [url, setUrl] = useState(""); const [view, setView] = useState("landing"); const [out, setOut] = useState(null);
  async function go(){ if(!url.trim()) return; setView("loading"); await delay(2200); setOut(MOCK); setView("results"); setTimeout(()=>document.getElementById("results")?.scrollIntoView({behavior:"smooth"}),80); }
  const P={bg:"#F8F6F0",ink:"#1A1A1A",inkSoft:"#444",card:"#FFFFFF",paper:"#FCFAF4",rule:"#E0DCD2",accent:"#7E22CE",mute:"#777"};
  const wrap={maxWidth:780,margin:"0 auto",padding:"64px 24px 96px"};
  const display="'Fraunces',Georgia,serif",sans="Inter,system-ui,sans-serif",mono="'JetBrains Mono',ui-monospace,monospace";
  const input={fontFamily:mono,fontSize:14,color:P.ink,background:P.bg,border:`1px solid ${P.rule}`,borderRadius:4,padding:"12px 16px",width:"100%",outline:"none"};
  return <div style={{background:P.bg,color:P.ink,fontFamily:sans,minHeight:"100vh"}}>
    <header style={wrap}>
      <div data-testid="eyebrow" style={{fontFamily:mono,fontSize:11,color:P.accent,letterSpacing:"0.2em",textTransform:"uppercase",marginBottom:32}}>For everyone whose Pocket queue is now homeless</div>
      <h1 style={{fontFamily:display,fontWeight:400,fontSize:"clamp(46px,7vw,80px)",lineHeight:0.97,letterSpacing:"-0.035em",margin:0}}>Save it. Skim it.<br/><em style={{fontStyle:"italic",color:P.accent}}>Find it again.</em></h1>
      <p style={{fontFamily:display,fontSize:22,fontStyle:"italic",lineHeight:1.45,color:P.inkSoft,margin:"32px 0 28px",maxWidth:560}}>Pocket is done. Instapaper is sleepy. You have 2,400 saves you'll never read. Paste a link, get a TL;DR you'll actually skim, the key passages, and a tag so future-you can find it.</p>
      <button data-testid="try-sample" onClick={()=>setUrl(SAMPLE)} style={{fontFamily:sans,fontSize:16,fontWeight:600,background:P.ink,color:P.bg,border:"none",padding:"16px 28px",borderRadius:4,cursor:"pointer"}}>Try with a Nature paper →</button>
    </header>
    <section style={{...wrap,paddingTop:0}}>
      <div id="input-panel" style={{background:P.card,border:`1px solid ${P.rule}`,borderRadius:6,padding:24}}>
        <div style={{fontFamily:mono,fontSize:11,color:P.accent,letterSpacing:"0.18em",textTransform:"uppercase",marginBottom:14}}>Step 1 of 2 · Paste a link or article text</div>
        <input data-testid="url" value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://..." style={input}/>
        <div style={{display:"flex",justifyContent:"flex-end",marginTop:14}}>
          <button data-testid="analyze-btn" onClick={go} disabled={!url.trim()||view==="loading"} style={{fontFamily:sans,fontSize:15,fontWeight:600,background:url.trim()&&view!=="loading"?P.accent:P.rule,color:url.trim()&&view!=="loading"?P.bg:P.mute,border:"none",padding:"12px 24px",borderRadius:4,cursor:url.trim()&&view!=="loading"?"pointer":"not-allowed"}}>{view==="loading"?"Reading...":"Save it →"}</button>
        </div>
      </div>
    </section>
    {view==="results"&&out&&<section id="results" style={{...wrap,paddingTop:32}}>
      <div data-testid="summary" style={{background:P.card,border:`1px solid ${P.rule}`,borderRadius:6,padding:28,marginBottom:20}}>
        <div style={{fontFamily:mono,fontSize:11,color:P.accent,letterSpacing:0.2,textTransform:"uppercase",marginBottom:6}}>{out.source} · {out.read_time} read</div>
        <div style={{fontFamily:display,fontSize:24,fontWeight:500,lineHeight:1.25,marginBottom:14}}>{out.title}</div>
        <div style={{fontFamily:sans,fontSize:15,color:P.ink,lineHeight:1.6,marginBottom:16}}>{out.tldr}</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{out.tags.map((t,i)=>(<span key={i} style={{fontFamily:mono,fontSize:11,padding:"4px 10px",background:"rgba(126,34,206,0.08)",color:P.accent,borderRadius:3,textTransform:"uppercase",letterSpacing:0.1}}>{t}</span>))}</div>
      </div>
      <div style={{background:P.card,border:`1px solid ${P.rule}`,borderLeft:`4px solid ${P.accent}`,borderRadius:4,padding:"22px 26px",marginBottom:14}}>
        <div style={{fontFamily:mono,fontSize:11,color:P.accent,letterSpacing:0.18,textTransform:"uppercase",marginBottom:14}}>Key passages</div>
        {out.key_passages.map((p,i)=>(<div key={i} style={{fontFamily:display,fontStyle:"italic",fontSize:16,color:P.ink,lineHeight:1.55,padding:"10px 0",borderTop:i>0?`1px solid ${P.rule}`:"none"}}>{p}</div>))}
      </div>
      <div style={{padding:"18px 22px",background:"rgba(126,34,206,0.05)",borderRadius:4}}>
        <div style={{fontFamily:mono,fontSize:11,color:P.accent,letterSpacing:0.18,textTransform:"uppercase",marginBottom:8}}>Why future-you will want this</div>
        <div style={{fontFamily:sans,fontSize:14,color:P.ink,lineHeight:1.55}}>{out.why_save}</div>
        <div style={{fontFamily:sans,fontSize:13,color:P.mute,marginTop:10,fontStyle:"italic"}}>{out.later}</div>
      </div>
    </section>}
    <footer style={{...wrap,paddingTop:32,paddingBottom:56,borderTop:`1px solid ${P.rule}`}}>
      <div style={{fontFamily:mono,fontSize:11,color:P.mute,textAlign:"center",lineHeight:1.65}}>Demo uses canned analysis on a sample paper. Production version fetches and parses the article locally.</div>
    </footer>
  </div>;
}
const root = ReactDOM.createRoot(document.getElementById("root")); root.render(<App/>);
</script>
<script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="gooboolygoo" data-description="Support me on Buy me a coffee!" data-message="Love this project? Donate to keep it going" data-color="#5F7FFF" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
</body></html>
