<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Otterly Different. AI notes for 1:1s, not sales calls.</title>
<meta name="description" content="Every AI meeting tool is built for sales calls. Your 1:1s deserve better. Track themes across months, surface what came up last time, draft the follow-up.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>html,body{margin:0;padding:0;background:#0B0F14}.__loading{font-family:Inter,system-ui,sans-serif;color:#888;text-align:center;padding-top:200px}</style></head><body>
<div id="root"><div class="__loading">Loading...</div></div>
<script type="text/babel" data-presets="react">
const { useState } = React;
const SAMPLE = "Maya, my senior IC. Today we talked about the migration project, her concern that she keeps getting pulled into incident response, and whether she should apply for the staff promotion this cycle. She mentioned again that she wants more design feedback.";
const MOCK = {
  person: "Maya",
  this_session: ["Migration project on track for July, but team is one engineer light","Wants out of the on-call rotation; tied to deeper concern about being seen as 'infra fixer' rather than designer","Staff promo cycle: she's hesitant; the committee already passed once and she's afraid of a second pass"],
  recurring_themes: [{ t: "Wants more design feedback", count: 5, since: "Jan 2026", note: "Mentioned in 5 of last 8 1:1s. You said 'let's pair on the next RFC' twice. It hasn't happened." },{ t: "Wants out of incident response", count: 4, since: "Feb 2026", note: "Came up after the Feb outage. Not addressed since." },{ t: "Promo doubts", count: 3, since: "Mar 2026", note: "First mention after the H1 committee result." }],
  followups_due: [{ from: "Apr 3 1:1", what: "Send her the design doc template you mentioned", overdue_days: 47 },{ from: "Mar 19 1:1", what: "Intro her to the staff IC in another org", overdue_days: 62 }],
  next_prompts: ["Open with: 'You've raised the design-feedback gap five times now. I haven't moved on it. Let me commit to a specific date.'","Address the incident rotation directly: do you have authority to remove her? If not, say so.","Promo: ask her what she'd need to see to apply this cycle. Don't talk her into it."]
};
const delay = (ms) => new Promise(r => setTimeout(r, ms));
function App(){
  const [text, setText] = useState(""); const [view, setView] = useState("landing"); const [out, setOut] = useState(null);
  async function go(){ if(!text.trim()) return; setView("loading"); await delay(2200); setOut(MOCK); setView("results"); setTimeout(()=>document.getElementById("results")?.scrollIntoView({behavior:"smooth"}),80); }
  const P={bg:"#0B0F14",ink:"#E8EAED",inkSoft:"#B0B8C4",card:"#141A22",paper:"#1A2230",rule:"#2A3441",accent:"#60A5FA",warn:"#FBBF24",mute:"#7A8595"};
  const wrap={maxWidth:820,margin:"0 auto",padding:"64px 24px 96px"};
  const display="'Fraunces',Georgia,serif",sans="Inter,system-ui,sans-serif",mono="'JetBrains Mono',ui-monospace,monospace";
  return <div style={{background:P.bg,color:P.ink,fontFamily:sans,minHeight:"100vh"}}>
    <header style={wrap}>
      <div data-testid="eyebrow" style={{fontFamily:mono,fontSize:11,color:P.accent,letterSpacing:"0.2em",textTransform:"uppercase",marginBottom:32}}>For engineering managers who skim their 1:1 notes</div>
      <h1 style={{fontFamily:display,fontWeight:400,fontSize:"clamp(46px,7vw,80px)",lineHeight:0.97,letterSpacing:"-0.035em",margin:0}}>Your report has<br/>told you five times.<br/>You <em style={{fontStyle:"italic",color:P.accent}}>did not notice.</em></h1>
      <p style={{fontFamily:display,fontSize:22,fontStyle:"italic",lineHeight:1.45,color:P.inkSoft,margin:"32px 0 28px",maxWidth:600}}>Every AI meeting note tool is built for sales calls. Your 1:1s deserve better. Track recurring themes across months, surface the followup you promised but never did, draft the prompt for next time.</p>
      <button data-testid="try-sample" onClick={()=>setText(SAMPLE)} style={{fontFamily:sans,fontSize:16,fontWeight:600,background:P.accent,color:"#0A1422",border:"none",padding:"16px 28px",borderRadius:4,cursor:"pointer"}}>Try with a sample 1:1 →</button>
    </header>
    <section style={{...wrap,paddingTop:0}}>
      <div id="input-panel" style={{background:P.paper,border:`1px solid ${P.rule}`,borderRadius:6,padding:28}}>
        <div style={{fontFamily:mono,fontSize:11,color:P.accent,letterSpacing:"0.18em",textTransform:"uppercase",marginBottom:14}}>Step 1 of 2 · Today's notes</div>
        <textarea data-testid="bill-input" value={text} onChange={e=>setText(e.target.value)} placeholder="Paste your raw notes from today's 1:1" style={{width:"100%",minHeight:160,fontFamily:sans,fontSize:14,lineHeight:1.55,color:P.ink,border:`1px solid ${P.rule}`,borderRadius:4,padding:"14px 16px",outline:"none",background:P.bg,resize:"vertical"}}/>
        <div style={{display:"flex",justifyContent:"flex-end",marginTop:14}}>
          <button data-testid="analyze-btn" onClick={go} disabled={!text.trim()||view==="loading"} style={{fontFamily:sans,fontSize:15,fontWeight:600,background:text.trim()&&view!=="loading"?P.accent:P.rule,color:text.trim()&&view!=="loading"?"#0A1422":P.mute,border:"none",padding:"12px 24px",borderRadius:4,cursor:text.trim()&&view!=="loading"?"pointer":"not-allowed"}}>{view==="loading"?"Reading history...":"Show me the throughline  →"}</button>
        </div>
      </div>
    </section>
    {view==="results"&&out&&<section id="results" style={{...wrap,paddingTop:32}}>
      <div data-testid="summary" style={{background:P.card,border:`1px solid ${P.rule}`,borderRadius:6,padding:28,marginBottom:24}}>
        <div style={{fontFamily:mono,fontSize:11,color:P.accent,letterSpacing:0.2,textTransform:"uppercase",marginBottom:8}}>Today's 1:1 with {out.person}</div>
        <ul style={{margin:0,paddingLeft:20,fontFamily:sans,fontSize:14,color:P.inkSoft,lineHeight:1.65}}>{out.this_session.map((s,i)=>(<li key={i} style={{marginBottom:6}}>{s}</li>))}</ul>
      </div>
      <div style={{background:P.card,border:`1px solid ${P.rule}`,borderLeft:`4px solid ${P.warn}`,borderRadius:4,padding:"22px 26px",marginBottom:14}}>
        <div style={{fontFamily:mono,fontSize:11,color:P.warn,letterSpacing:0.18,textTransform:"uppercase",marginBottom:14}}>Recurring themes (you may have stopped noticing)</div>
        {out.recurring_themes.map((t,i)=>(<div key={i} style={{padding:"12px 0",borderTop:i>0?`1px solid ${P.rule}`:"none"}}>
          <div style={{display:"flex",justifyContent:"space-between",fontFamily:sans,fontSize:15,fontWeight:600,marginBottom:4}}>{t.t}<span style={{fontFamily:mono,fontSize:12,color:P.warn}}>{t.count}× since {t.since}</span></div>
          <div style={{fontFamily:sans,fontSize:13,color:P.inkSoft,lineHeight:1.55}}>{t.note}</div>
        </div>))}
      </div>
      <div style={{background:P.card,border:`1px solid ${P.rule}`,borderLeft:`4px solid #EF4444`,borderRadius:4,padding:"22px 26px",marginBottom:14}}>
        <div style={{fontFamily:mono,fontSize:11,color:"#EF4444",letterSpacing:0.18,textTransform:"uppercase",marginBottom:14}}>Followups you owe</div>
        {out.followups_due.map((f,i)=>(<div key={i} style={{padding:"10px 0",borderTop:i>0?`1px solid ${P.rule}`:"none",display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:14}}>
          <div><div style={{fontFamily:sans,fontSize:14,fontWeight:600,color:P.ink}}>{f.what}</div><div style={{fontFamily:mono,fontSize:11,color:P.mute,marginTop:3}}>from {f.from}</div></div>
          <div style={{fontFamily:mono,fontSize:12,color:"#EF4444",whiteSpace:"nowrap"}}>{f.overdue_days}d overdue</div>
        </div>))}
      </div>
      <div style={{background:P.paper,border:`1px solid ${P.rule}`,borderRadius:6,padding:28,marginTop:24}}>
        <div style={{fontFamily:mono,fontSize:11,color:P.accent,letterSpacing:0.18,textTransform:"uppercase",marginBottom:14}}>Open next 1:1 with</div>
        <ol style={{margin:0,paddingLeft:20,fontFamily:sans,fontSize:14,color:P.ink,lineHeight:1.7}}>{out.next_prompts.map((p,i)=>(<li key={i} style={{marginBottom:8}}>{p}</li>))}</ol>
      </div>
    </section>}
    <footer style={{...wrap,paddingTop:32,paddingBottom:56,borderTop:`1px solid ${P.rule}`}}>
      <div style={{fontFamily:mono,fontSize:11,color:P.mute,textAlign:"center",lineHeight:1.65}}>Analysis is illustrative in this demo. Production version reads your meeting note history across months.</div>
    </footer>
  </div>;
}
const root = ReactDOM.createRoot(document.getElementById("root")); root.render(<App/>);
</script>
<script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="gooboolygoo" data-description="Support me on Buy me a coffee!" data-message="Love this project? Donate to keep it going" data-color="#5F7FFF" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
</body></html>
