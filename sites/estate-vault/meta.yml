title: Estate Vault
blurb: The will is in a safe nobody knows the combination of. The 401k beneficiary form was never updated after the divorce. The life insurance is a paper card in a drawer. The crypto seed phrase is on a Post-it next to the router. Estate Vault sorts it, seals it, and unlocks it for the right person when needed. Encrypted, client-side, zero-knowledge.
