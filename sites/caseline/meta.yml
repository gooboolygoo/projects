title: Caseline
blurb: Your US immigration case is full of deadlines you can't see. RFEs have 87 day response windows. H1B extensions are filable 180 days early. EAD renewals can give you a 540 day auto-extension, but only if you file in time. Caseline turns your case into a timeline of what is next, when, and what to do. Free, no signup, nothing leaves your browser.
tags:
  - immigration
  - consumer
  - ai
  - product
donate: true
