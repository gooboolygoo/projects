title: Schedule C
blurb: You are self-employed. You have a Notes app with line items and a shoebox of receipts and dread. Paste them in. We tell you which Schedule C line each one belongs on, which 50-percent rule applies, and the items you bought that you should not deduct with the conservative reason why.
