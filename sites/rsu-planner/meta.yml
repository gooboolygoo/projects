title: RSU Math
blurb: Most companies withhold federal tax on RSU vests at 22 percent. If your marginal rate is 32 or 37, you owe the rest in April. By then it has been spent. Enter your vest, see the gap, decide sell-to-cover. Free, runs in your browser.
