title: Intake
blurb: Clio costs 300 dollars a month and intake is still a Google Form plus PDF plus DocuSign plus payment link. Intake is mobile-first, runs a conflict check on submit, presents the engagement letter and collects the retainer in one flow. Drops the lead straight into Clio when they sign.
