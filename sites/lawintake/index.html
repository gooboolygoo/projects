<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Intake. Solo lawyers stop losing leads on the intake form.</title>
<meta name="description" content="Clio costs $300 a month and intake is still the gap. Mobile-first form, conflict check on submit, e-sign and retainer in one flow.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>html,body{margin:0;padding:0;background:#F7F4ED}.__loading{font-family:Inter,system-ui;color:#888;text-align:center;padding-top:200px}</style></head><body>
<div id="root"><div class="__loading">Loading...</div></div>
<script type="text/babel" data-presets="react">
const { useState } = React;
const STEPS = [
  { k:"contact", t:"Name + email + phone", complete:true },
  { k:"matter", t:"What is the matter?", complete:true, val:"Auto accident, June 12 2026" },
  { k:"opposing", t:"Other parties (conflict check)", complete:true, val:"Other driver: Marcus Rivera — passed ✓ no conflict" },
  { k:"docs", t:"Upload accident report", complete:true, val:"police_report.pdf · 1.2MB" },
  { k:"retainer", t:"Read + sign engagement letter", complete:false, val:"" },
  { k:"deposit", t:"$2,500 retainer deposit", complete:false, val:"" }
];
const LEADS = [
  { name:"R. Sanchez", matter:"Estate planning", time:"2h ago", stage:"signed", value:"$5k flat fee" },
  { name:"L. Chen", matter:"DUI defense", time:"5h ago", stage:"reviewing letter", value:"$8k retainer" },
  { name:"M. Smith", matter:"Custody mod", time:"1d ago", stage:"conflict check", value:"$3.5k retainer" },
  { name:"D. Park", matter:"Slip and fall", time:"2d ago", stage:"abandoned at retainer", value:"lost lead" }
];
function App(){
  const [view,setView]=useState("landing");
  function open(){ setView("dash"); setTimeout(()=>document.getElementById("d")?.scrollIntoView({behavior:"smooth"}),80); }
  const P={bg:"#F7F4ED",ink:"#1F1B16",inkSoft:"#5A544A",card:"#FFFFFF",rule:"#D9D2C2",accent:"#1E3A8A",done:"#15803D",no:"#B91C1C",mute:"#8A8275"};
  const wrap={maxWidth:820,margin:"0 auto",padding:"64px 24px 96px"};
  const display="'Fraunces',Georgia,serif",sans="Inter,system-ui,sans-serif",mono="'JetBrains Mono',ui-monospace,monospace";
  return <div style={{background:P.bg,color:P.ink,fontFamily:sans,minHeight:"100vh"}}>
    <header style={wrap}>
      <div data-testid="eyebrow" style={{fontFamily:mono,fontSize:11,color:P.accent,letterSpacing:"0.2em",textTransform:"uppercase",marginBottom:32}}>For solo attorneys and small firms</div>
      <h1 style={{fontFamily:display,fontWeight:400,fontSize:"clamp(46px,7vw,82px)",lineHeight:0.97,letterSpacing:"-0.035em",margin:0}}>You lose leads<br/>on the <em style={{fontStyle:"italic",color:P.accent}}>contact form.</em></h1>
      <p style={{fontFamily:display,fontSize:22,fontStyle:"italic",lineHeight:1.45,color:P.inkSoft,margin:"32px 0 28px",maxWidth:600}}>Clio is $300/month and intake is still a Google Form + PDF + DocuSign + payment link. Intake is mobile-first, runs a conflict check on submit, presents the engagement letter and collects the retainer in one flow. Drops the lead straight into Clio when they sign.</p>
      <div style={{display:"flex",flexWrap:"wrap",gap:16,alignItems:"center"}}>
        <button data-testid="try-sample" onClick={open} style={{fontFamily:sans,fontSize:16,fontWeight:600,background:P.accent,color:"#FFF",border:"none",padding:"16px 28px",borderRadius:4,cursor:"pointer"}}>Show me a sample intake →</button>
        <span style={{fontFamily:mono,fontSize:11,color:P.mute,textTransform:"uppercase"}}>· $79/mo · drops into Clio/MyCase</span>
      </div>
    </header>
    {view==="dash"&&<section id="d" style={{...wrap,paddingTop:0}}>
      <div data-testid="summary" style={{background:P.card,border:`1px solid ${P.rule}`,borderRadius:6,padding:24,marginBottom:14}}>
        <div style={{fontFamily:mono,fontSize:11,color:P.accent,letterSpacing:0.15,textTransform:"uppercase",marginBottom:10}}>In progress · Maria L. · Auto accident</div>
        {STEPS.map((s,i)=>(<div key={i} style={{padding:"10px 0",borderTop:i>0?`1px solid ${P.rule}`:"none",display:"flex",gap:12,alignItems:"baseline"}}>
          <div style={{width:18,height:18,borderRadius:3,border:`2px solid ${s.complete?P.done:P.rule}`,background:s.complete?P.done:"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"#FFF",fontSize:11,fontWeight:700}}>{s.complete?"✓":""}</div>
          <div style={{flex:1}}><div style={{fontFamily:sans,fontSize:14,fontWeight:600,color:s.complete?P.mute:P.ink}}>{s.t}</div>{s.val&&<div style={{fontFamily:mono,fontSize:11,color:P.mute,marginTop:2}}>{s.val}</div>}</div>
        </div>))}
      </div>
      <div style={{marginTop:14,padding:24,background:P.card,border:`1px solid ${P.rule}`,borderRadius:6}}>
        <div style={{fontFamily:mono,fontSize:11,color:P.accent,letterSpacing:0.15,textTransform:"uppercase",marginBottom:14}}>Recent leads</div>
        {LEADS.map((l,i)=>(<div key={i} style={{padding:"10px 0",borderTop:i>0?`1px solid ${P.rule}`:"none",display:"grid",gridTemplateColumns:"1fr 1fr 100px",gap:12,alignItems:"baseline"}}>
          <div><div style={{fontFamily:sans,fontSize:13,fontWeight:600}}>{l.name}</div><div style={{fontFamily:mono,fontSize:11,color:P.mute,marginTop:2}}>{l.matter} · {l.time}</div></div>
          <div style={{fontFamily:mono,fontSize:12,color:l.stage==="abandoned at retainer"?P.no:l.stage==="signed"?P.done:P.inkSoft}}>{l.stage}</div>
          <div style={{fontFamily:mono,fontSize:12,color:P.ink,textAlign:"right"}}>{l.value}</div>
        </div>))}
      </div>
    </section>}
    <footer style={{...wrap,paddingTop:32,paddingBottom:56,borderTop:`1px solid ${P.rule}`}}><div style={{fontFamily:mono,fontSize:11,color:P.mute,textAlign:"center",lineHeight:1.65}}>Conflict check via your existing Clio/Smokeball/PracticePanther. Drops signed leads back to the same.</div></footer>
  </div>;
}
const root = ReactDOM.createRoot(document.getElementById("root")); root.render(<App/>);
</script>
<script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="gooboolygoo" data-description="Support me on Buy me a coffee!" data-message="Love this project? Donate to keep it going" data-color="#5F7FFF" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
</body></html>
