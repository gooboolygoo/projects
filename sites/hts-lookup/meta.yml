title: HTS Match
blurb: Your customs broker charges 150 dollars per shipment to look up a tariff code. They pick the safe-for-them code, not the lowest-legal-for-you. Paste a product description, get the right HTS code, the duty rate, and the two compliance flags that will get the container held in port if you ignore them.
